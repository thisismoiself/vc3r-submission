# ─────────────────────────────────────────────────────────────
# Overfit-8-frames experiment config
# ─────────────────────────────────────────────────────────────
# Replica scene
replica_root: /home/nic/repos/rci/courses/sa/vc3r/datasets/replica
room: room0
frame_stride: 20          # sample frames 0, 20, 40, … (8 frames total)
num_frames: 8
image_width: 518          # DA3 processing resolution (multiple of 14)
image_height: 392

# NOVA3R AE checkpoint (scene_ae stage 1)
nova3r_ckpt: /usr/prakt/s0016/vc3r/checkpoints/nova3r/scene_ae/checkpoint-last.pth

# DA3 model (HuggingFace id)
da3_model: depth-anything/DA3-LARGE-1.1

# DA3 backbone layer to use as source tokens (3 = last out_layer = layer 23)
da3_source_layer_index: 3
# Maximum source tokens per frame (uniform subsample)
da3_max_source_tokens: 2048

# Number of mesh points to sample for NOVA3R AE input
mesh_sample_points: 8192

# Adapter architecture  (must match source_dim of chosen DA3 layer)
source_dim: 2048          # ViT-L last layer with camera token concat
hidden_dim: 512
target_tokens: 768        # K_NOVA3R (from scene_ae config)
target_dim: 128           # D_NOVA3R (from scene_ae config)
depth: 4
num_heads: 8

# Training
steps: 20000
batch_size: 16
best_checkpoint_every_samples: 1000
lr: 1.0e-4
weight_decay: 1.0e-4
log_every: 10

# Output
data_dir: experiments/overfit_8frames/data
ckpt_dir: experiments/overfit_8frames/checkpoints

# Multi-scene training
train_rooms:
  - room0
test_rooms:
  - room0
samples_per_room: 1845
heldout_eval: true
heldout_room: room0
heldout_start_idx: 929
eval_samples: 1
eval_num_queries: 768

# Wandb
wandb_project: da3-nova3r-adapter
wandb_run_name: room0_N1845_s20_heldout929_100k
